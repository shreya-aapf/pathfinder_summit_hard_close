<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ProcureOS{% endblock %}</title>
  <link rel="stylesheet" href="{{ request.script_root }}/static/style.css" />
</head>
<body>
  <nav class="topnav">
    <div class="topnav-inner">
      <a href="{{ request.script_root }}/" class="topnav-brand">
        <span class="brand-icon">&#9670;</span>
        ProcureOS
      </a>
      <div class="topnav-links">
        <a href="{{ request.script_root }}/" class="topnav-link {% if request.path == '/' %}active{% endif %}">Purchase Orders</a>
        <a href="{{ request.script_root }}/settings/api-keys" class="topnav-link {% if '/settings/api-keys' in request.path %}active{% endif %}">API Keys</a>
      </div>
      <div class="topnav-actions">
        <a href="{{ request.script_root }}/po/new" class="btn btn-primary btn-sm">+ New PO</a>
      </div>
    </div>
  </nav>

  <main class="main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">
              <span>{{ message }}</span>
              <button class="flash-close" onclick="this.parentElement.remove()">&#10005;</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="{{ request.script_root }}/static/app.js"></script>
</body>
</html>
