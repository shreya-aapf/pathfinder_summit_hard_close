{% extends "base.html" %}
{% block title %}Create account — Pathfinder Summit{% endblock %}
{% block content %}
<div class="panel">
  <h1>Create account</h1>
  <form method="post" action="/register">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus />
    <label for="password">Password (8 or more characters)</label>
    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required />
    <button type="submit">Create account</button>
  </form>
  <p class="alt">Already registered? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
