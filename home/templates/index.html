<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pathfinder Summit — Invoice Matching Platform</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
    main { max-width: 880px; margin: 0 auto; padding: 4rem 1.5rem; }
    h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
    p.lead { color: #475569; margin: 0 0 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    a.card { display: block; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 1.25rem; text-decoration: none; color: inherit; }
    a.card:hover { border-color: #94a3b8; }
    .card h2 { margin: 0 0 0.35rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #64748b; font-size: 0.9rem; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <h1>Pathfinder Summit — Invoice Matching Platform</h1>
    <p class="lead">Choose an application.</p>
    <div class="grid">
      {% for a in apps %}
      <a class="card" href="{{ a.path }}">
        <h2>{{ a.name }}</h2>
        <p>{{ a.blurb }}</p>
      </a>
      {% endfor %}
    </div>
  </main>
</body>
</html>
