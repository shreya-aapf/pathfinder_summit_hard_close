{% extends "base.html" %}
{% block content %}
{% if user %}
<div class="topbar">
  <span>Signed in as <strong>{{ user }}</strong></span>
  <form method="post" action="/logout"><button class="link" type="submit">Sign out</button></form>
</div>
{% endif %}
<h1>Pathfinder Summit — Invoice Matching Platform</h1>
<p class="lead">Choose an application.</p>
<div class="grid">
  {% for a in apps %}
  <a class="card" href="{{ a.path }}">
    <h2>{{ a.name }}</h2>
    <p>{{ a.blurb }}</p>
  </a>
  {% endfor %}
</div>
{% endblock %}
