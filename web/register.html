<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Pathfinder Summit</title>
  <link rel="stylesheet" href="assets/base.css" />
</head>
<body>
  <main>
    <div id="flash"></div>
    <div class="panel">
      <h1>Create account</h1>
      <form id="register-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus />
        <label for="password">Password (8 or more characters)</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required />
        <button type="submit" id="submit">Create account</button>
      </form>
      <p class="alt">Already registered? <a href="login.html">Sign in</a></p>
    </div>
  </main>
  <script type="module" src="assets/js/register.js"></script>
</body>
</html>
